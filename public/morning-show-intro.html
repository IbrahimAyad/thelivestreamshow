<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morning Stream Show - Intro</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Pacifico&family=Bebas+Neue&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            position: relative;
            font-family: 'Oswald', sans-serif;
        }

        .background {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(145deg, 
                #2d1f3d 0%, 
                #1e1a2e 25%,
                #252040 50%,
                #1a1528 75%,
                #12101a 100%);
        }

        .glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.4;
        }

        .glow-1 {
            width: 700px;
            height: 700px;
            background: linear-gradient(135deg, #FF6B35, #FFD700);
            top: -250px;
            right: -150px;
            animation: glowPulse 8s ease-in-out infinite;
        }

        .glow-2 {
            width: 500px;
            height: 500px;
            background: #8B5CF6;
            bottom: -200px;
            left: -100px;
            animation: glowPulse 8s ease-in-out infinite 2s;
        }

        .glow-3 {
            width: 400px;
            height: 400px;
            background: #FF8C42;
            top: 40%;
            left: 40%;
            opacity: 0.2;
            animation: glowPulse 8s ease-in-out infinite 4s;
        }

        @keyframes glowPulse {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.3); opacity: 0.5; }
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        .title-section {
            position: absolute;
            left: 120px;
            top: 50%;
            transform: translateY(-50%);
            overflow: hidden;
        }

        .title-line {
            opacity: 0;
            transform: translateX(-100px);
        }

        .title-morning {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 180px;
            font-weight: 400;
            color: #FF8C42;
            letter-spacing: 8px;
            line-height: 0.85;
            text-shadow: 4px 4px 0 rgba(255, 107, 53, 0.3), 0 0 60px rgba(255, 140, 66, 0.5);
            animation: slideInTitle 1s ease-out 2s forwards;
        }

        .title-stream {
            font-family: 'Pacifico', cursive;
            font-size: 100px;
            color: #B8B8B8;
            margin-left: 20px;
            line-height: 1;
            text-shadow: 3px 3px 0 rgba(0, 0, 0, 0.3);
            animation: slideInTitle 1s ease-out 2.5s forwards;
        }

        .title-show {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 180px;
            font-weight: 400;
            color: #FFFFFF;
            letter-spacing: 8px;
            line-height: 0.85;
            text-shadow: 4px 4px 0 rgba(139, 92, 246, 0.3);
            animation: slideInTitle 1s ease-out 3s forwards;
        }

        .title-tagline {
            font-family: 'Oswald', sans-serif;
            font-size: 32px;
            font-weight: 400;
            color: #FFD700;
            letter-spacing: 8px;
            text-transform: uppercase;
            margin-top: 25px;
            opacity: 0;
            animation: slideInTitle 1s ease-out 3.5s forwards;
        }

        @keyframes slideInTitle {
            0% { opacity: 0; transform: translateX(-100px); }
            100% { opacity: 1; transform: translateX(0); }
        }

        .tiles-section {
            position: absolute;
            right: 80px;
            top: 50%;
            transform: translateY(-50%);
            width: 850px;
            height: 750px;
        }

        .polaroid {
            position: absolute;
            background: #FFFFFF;
            padding: 12px 12px 50px 12px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 10px 20px rgba(0, 0, 0, 0.3);
            opacity: 0;
            transform: scale(0) rotate(0deg);
        }

        .polaroid img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top center;
            display: block;
        }

        .polaroid-inner {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .polaroid-1 {
            width: 300px;
            height: 350px;
            top: 20px;
            left: 30px;
            animation: polaroidDrop1 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 5s forwards;
        }
        .polaroid-1 .polaroid-inner { background: linear-gradient(135deg, #FFD700, #FFA500); }

        .polaroid-2 {
            width: 280px;
            height: 330px;
            top: 50px;
            right: 20px;
            animation: polaroidDrop2 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 7s forwards;
        }
        .polaroid-2 .polaroid-inner { background: linear-gradient(135deg, #8B5CF6, #6D28D9); }

        .polaroid-3 {
            width: 320px;
            height: 370px;
            bottom: 30px;
            left: 180px;
            animation: polaroidDrop3 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 9s forwards;
        }
        .polaroid-3 .polaroid-inner { background: linear-gradient(135deg, #FF6B35, #FF8C42); }

        @keyframes polaroidDrop1 {
            0% { opacity: 0; transform: scale(0) rotate(0deg) translateY(-300px); }
            60% { opacity: 1; transform: scale(1.1) rotate(-10deg) translateY(15px); }
            100% { opacity: 1; transform: scale(1) rotate(-8deg) translateY(0); }
        }

        @keyframes polaroidDrop2 {
            0% { opacity: 0; transform: scale(0) rotate(0deg) translateY(-300px); }
            60% { opacity: 1; transform: scale(1.1) rotate(8deg) translateY(15px); }
            100% { opacity: 1; transform: scale(1) rotate(5deg) translateY(0); }
        }

        @keyframes polaroidDrop3 {
            0% { opacity: 0; transform: scale(0) rotate(0deg) translateY(-300px); }
            60% { opacity: 1; transform: scale(1.1) rotate(5deg) translateY(15px); }
            100% { opacity: 1; transform: scale(1) rotate(3deg) translateY(0); }
        }

        .logo-container {
            position: absolute;
            bottom: 50px;
            left: 120px;
            opacity: 0;
            transform: translateY(30px);
            animation: logoReveal 1s ease-out 12s forwards;
        }

        .logo-container img {
            width: 160px;
            height: 160px;
            filter: drop-shadow(0 8px 25px rgba(0, 0, 0, 0.6));
        }

        @keyframes logoReveal {
            to { opacity: 1; transform: translateY(0); }
        }

        .live-badge {
            position: absolute;
            top: 50px;
            right: 60px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(135deg, #e63946, #c1121f);
            padding: 15px 30px;
            border-radius: 8px;
            opacity: 0;
            transform: scale(0);
            animation: badgePop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 14s forwards;
            box-shadow: 0 8px 30px rgba(230, 57, 70, 0.5);
        }

        .live-dot {
            width: 14px;
            height: 14px;
            background: #FFFFFF;
            border-radius: 50%;
            animation: livePulse 1s ease-in-out infinite;
        }

        @keyframes livePulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.2); }
        }

        .live-text {
            font-family: 'Oswald', sans-serif;
            font-size: 24px;
            font-weight: 600;
            color: #FFFFFF;
            letter-spacing: 4px;
        }

        @keyframes badgePop {
            0% { opacity: 0; transform: scale(0); }
            100% { opacity: 1; transform: scale(1); }
        }

        .schedule {
            position: absolute;
            bottom: 70px;
            right: 80px;
            text-align: right;
            opacity: 0;
            animation: fadeIn 1s ease-out 16s forwards;
        }

        .schedule-days {
            font-family: 'Oswald', sans-serif;
            font-size: 28px;
            color: #FFFFFF;
            letter-spacing: 3px;
            text-transform: uppercase;
            opacity: 0.9;
        }

        .schedule-time {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 52px;
            color: #FFD700;
            letter-spacing: 2px;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: rgba(255, 215, 0, 0.6);
            border-radius: 50%;
            animation: float 15s linear infinite;
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
        }

        .shine-overlay {
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            animation: shineSweep 5s ease-in-out 4s infinite;
        }

        @keyframes shineSweep {
            0% { left: -100%; }
            40%, 100% { left: 200%; }
        }
    </style>
</head>
